  <path d="M20 72 C28 69 40 68 46 70" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  <path d="M20 77 C28 74 40 73 46 75" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  <path d="M80 72 C72 69 60 68 54 70" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  <path d="M80 77 C72 74 60 73 54 75" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
</svg>
