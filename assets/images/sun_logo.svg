<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#133e6e"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
  </defs>

  <!-- Sun Rays -->
  <line x1="50" y1="12" x2="50" y2="20" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="20" x2="34" y2="26" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="20" x2="66" y2="26" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="15" y1="38" x2="23" y2="40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="85" y1="38" x2="77" y2="40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="12" y1="60" x2="20" y2="58" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="88" y1="60" x2="80" y2="58" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Rising Sun Semi-Circle -->
  <path d="M26 62 A24 24 0 0 1 74 62 Z" fill="url(#sunGrad)"/>

  <!-- Open Book of Wisdom -->
  <!-- Left Page -->
