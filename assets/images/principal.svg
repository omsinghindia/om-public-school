  <!-- Face -->
  <ellipse cx="100" cy="90" rx="33" ry="38" fill="#fad2b3"/>

  <!-- Hair front style -->
  <path d="M67 85 C67 55 80 44 100 44 C120 44 133 55 133 85 C125 58 115 52 100 52 C85 52 75 58 67 85 Z" fill="#1e1b4b"/>
  <!-- Traditional Bindi -->
  <circle cx="100" cy="74" r="2.5" fill="#dc2626"/>

