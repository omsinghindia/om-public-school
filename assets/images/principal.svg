  <rect x="74" y="80" width="20" height="13" rx="3" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="106" y="80" width="20" height="13" rx="3" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="94" y1="86" x2="106" y2="86" stroke="#1e293b" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="84" cy="86" r="2" fill="#0f172a"/>
  <circle cx="116" cy="86" r="2" fill="#0f172a"/>

  <!-- Nose -->
